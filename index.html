<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キングダム覇道　伝承最適化ツール</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; margin: 20px; color: #333; }
        h1 { margin-bottom: 5px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .description { font-size: 14px; color: #666; margin-bottom: 20px; }
        /* 5x5盤面スタイル */
        .board { display: grid; grid-template-columns: repeat(5, 50px); grid-gap: 5px; justify-content: center; margin-bottom: 20px; }
        .cell { width: 50px; height: 50px; background-color: #ffffff; border: 1px solid #333; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; user-select: none; transition: background 0.2s; }
        .cell.active { background-color: #ffffff; border-color: #333; } /* 置けるマス */
        .cell.block { background-color: #333333; color: white; border-color: #ccc; } /* 障害物マス */
        /* カウンタ表示 */
        .info { margin-bottom: 15px; font-weight: bold; }
        .info span { color: #007bff; }
        /* ボタン */
        button { background: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; transition: background 0.2s; margin: 5px; }
        button:hover { background: #0056b3; }
        button.secondary { background: #6c757d; }
        button.secondary:hover { background: #545b62; }
        /* 結果表示エリア */
        #results { margin-top: 30px; text-align: left; }
        .solution-count { font-weight: bold; font-size: 18px; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        .grid-list { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .mini-board { display: grid; grid-template-columns: repeat(5, 25px); grid-gap: 2px; background: #eee; padding: 5px; border-radius: 4px; border: 1px solid #ccc; }
        .mini-cell { width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border-radius: 2px; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>キングダム覇道　伝承最適化ツール</h1>
    <div class="description">
        マスをクリックして「障害物(黒)」を指定します（初期はすべて置ける白マスです）。<br>
        残った白マスが 8, 12, 16, 20 マスのいずれかになったら「解析開始」を押してください。<br>
    </div>

    <div class="info">現在の置けるマス数: <span id="active-count">25</span> / 25</div>

    <div class="board" id="main-board"></div>

    <button id="solve-btn">解析開始</button>
    <button class="secondary" id="reset-btn">リセット</button>

    <div id="results"></div>
</div>

<script>
// --- 1. 固定された12種類のブロック定義（回転・反転済みの状態を直接指定） ---
// ※各ブロックの座標は、必ず一番左上のマスが基準（または0番目）になり、左上詰めで定義されています。
const FIXED_PIECES = {
    // ■ T型 (4方向)
    'T1': [[0,0], [0,1], [0,2], [1,1]], // 凸
    'T2': [[0,1], [1,0], [1,1], [2,1]], // ├
    'T3': [[0,1], [1,0], [1,1], [1,2]], // 凹
    'T4': [[0,0], [1,0], [1,1], [2,0]], // ┤

    // ■ L型 (4方向)
    'L1': [[0,0], [1,0], [2,0], [2,1]], // L
    'L2': [[0,0], [0,1], [0,2], [1,2]], // ┏━
    'L3': [[0,0], [0,1], [1,1], [2,1]], // ┓
    'L4': [[0,0], [1,0], [1,1], [1,2]], // ┗━

    // ■ Z型・S型 (4方向)
    'Z1': [[0,0], [0,1], [1,1], [1,2]], // Z（横）
    'Z2': [[0,1], [1,0], [1,1], [2,0]], // Z（縦）
    'Z3': [[0,1], [0,2], [1,0], [1,1]], // S（横）
    'Z4': [[0,0], [1,0], [1,1], [2,1]]  // S（縦）
};

// 塗り分け用の美しいパステルカラー4色
const VISUAL_COLORS = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f'];
const OBSTACLE_COLOR = '#333333';

// --- 2. 画面（盤面）の初期化設定 ---
// 【修正】初期状態をすべて「true (置ける白マス)」に変更
const boardState = Array(25).fill(true); 
const mainBoard = document.getElementById('main-board');
const activeCountEl = document.getElementById('active-count');

function createBoard() {
    mainBoard.innerHTML = '';
    for (let i = 0; i < 25; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell', 'active'); // 初期はすべて白マス
        cell.dataset.index = i;
        cell.addEventListener('click', () => {
            boardState[i] = !boardState[i];
            cell.classList.toggle('active', boardState[i]);
            cell.classList.toggle('block', !boardState[i]);
            updateCount();
        });
        mainBoard.appendChild(cell);
    }
}

function updateCount() {
    const count = boardState.filter(Boolean).length;
    activeCountEl.textContent = count;
}

// --- 3. バックトラッキング探索エンジン ---
let solutions = [];

function solvePuzzle() {
    solutions = [];
    const activeCount = boardState.filter(Boolean).length;
    
    if (![8, 12, 16, 20].includes(activeCount)) {
        alert("置けるマス（白マス）の数を 8, 12, 16, 20マスのいずれかにしてください！");
        return;
    }
    
    const searchBoard = [];
    for (let r = 0; r < 5; r++) {
        searchBoard.push([]);
        for (let c = 0; c < 5; c++) {
            searchBoard[r].push(boardState[r * 5 + c] ? '.' : 'X');
        }
    }

    function backtrack(blockId = 1) {
        let startR = -1, startC = -1;
        for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
                if (searchBoard[r][c] === '.') {
                    startR = r; startC = c;
                    break;
                }
            }
            if (startR !== -1) break;
        }

        if (startR === -1) {
            solutions.push(searchBoard.map(row => [...row]));
            return;
        }

        for (const [name, pattern] of Object.entries(FIXED_PIECES)) {
            const offsetR = startR - pattern;
            const offsetC = startC - pattern;

            let canPlace = true;
            const placedPositions = [];

            for (const [pr, pc] of pattern) {
                const br = pr + offsetR;
                const bc = pc + offsetC;

                if (br >= 0 && br < 5 && bc >= 0 && bc < 5 && searchBoard[br][bc] === '.') {
                    placedPositions.push([br, bc]);
                } else {
                    canPlace = false;
                    break;
                }
            }

            if (canPlace) {
                // 【修正】色の重複を判定するため、ブロック名ではなく「固有の識別文字列」を書き込む
                // 例: "T1_1", "T1_2" などにすることで、別々の塊として区別できるようにする
                const idString = `${name}_${blockId}`;
                for (const [br, bc] of placedPositions) searchBoard[br][bc] = idString;

                backtrack(blockId + 1);

                for (const [br, bc] of placedPositions) searchBoard[br][bc] = '.';
            }
        }
    }

    backtrack();
    renderResults();
}

// --- 4. 隣接ブロックの色被りを防ぐグラフ彩色アルゴリズム ---
function colorSolution(sol) {
    const colorMap = {}; // 各ブロックID（"T1_1"等）に対応するカラーインデックス(0~3)
    const blockIds = new Set();
    
    for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
            if (sol[r][c] !== 'X') blockIds.add(sol[r][c]);
        }
    }

    // 各ブロックについて、隣接するブロックを調べる（隣接リスト）
    const adj = {};
    blockIds.forEach(id => adj[id] = new Set());

    for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
            const current = sol[r][c];
            if (current === 'X') continue;
            
            // 下と右のマスをチェック
            const neighbors = [[r+1, c], [r, c+1]];
            for (const [nr, nc] of neighbors) {
                if (nr < 5 && nc < 5) {
                    const next = sol[nr][nc];
                    if (next !== 'X' && next !== current) {
                        adj[current].add(next);
                        adj[next].add(current);
                    }
                }
            }
        }
    }

    // 隣接するブロックと被らないように4色から貪欲に割り当て
    blockIds.forEach(id => {
        const usedColors = new Set();
        adj[id].forEach(neighbor => {
            if (colorMap[neighbor] !== undefined) {
                usedColors.add(colorMap[neighbor]);
            }
        });
        
        let color = 0;
        while (usedColors.has(color)) {
            color++;
        }
        colorMap[id] = color;
    });

    return colorMap;
}

// --- 5. 結果の描画表示 ---
function renderResults() {
    const resultsContainer = document.getElementById('results');
    resultsContainer.innerHTML = '';

    const countDiv = document.createElement('div');
    countDiv.classList.add('solution-count');
    countDiv.textContent = `解析完了: 合計 ${solutions.length} 件のクリアパターンが見つかりました`;
    resultsContainer.appendChild(countDiv);

    const gridList = document.createElement('div');
    gridList.classList.add('grid-list');

    const displayLimit = Math.min(solutions.length, 300);
    
    for (let i = 0; i < displayLimit; i++) {
        const sol = solutions[i];
        // 隣接するブロックが別々の色になるようマップを生成
        const colorMap = colorSolution(sol);

        const miniBoard = document.createElement('div');
        miniBoard.classList.add('mini-board');

        for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
                const cellVal = sol[r][c];
                const miniCell = document.createElement('div');
                miniCell.classList.add('mini-cell');
                
                if (cellVal === 'X') {
                    miniCell.style.backgroundColor = OBSTACLE_COLOR;
                    miniCell.textContent = '';
                } else {
                    // 自動計算されたカラーインデックスを適用
                    const colorIdx = colorMap[cellVal];
                    miniCell.style.backgroundColor = VISUAL_COLORS[colorIdx % VISUAL_COLORS.length];
                    // "T1_1" から元のブロック名 "T1" だけを取り出して表示
                    miniCell.textContent = cellVal.split('_')[0];
                }
                miniBoard.appendChild(miniCell);
            }
        }
        gridList.appendChild(miniBoard);
    }

    resultsContainer.appendChild(gridList);
    
    if (solutions.length > 300) {
        const moreDiv = document.createElement('div');
        moreDiv.style.textAlign = 'center';
        moreDiv.style.marginTop = '15px';
        moreDiv.style.fontWeight = 'bold';
        moreDiv.textContent = `...件数が多いため、他 ${solutions.length - 300} 件のパターンは表示を省略しました。`;
        resultsContainer.appendChild(moreDiv);
    }
}

// イベントリスナー
document.getElementById('solve-btn').addEventListener('click', solvePuzzle);
document.getElementById('reset-btn').addEventListener('click', () => {
    boardState.fill(true); // 【修正】リセット時もすべて白マスに
    createBoard();
    updateCount();
    document.getElementById('results').innerHTML = '';
});

// 開始
createBoard();
</script>
</body>
</html>
