<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キングダム覇道 伝承パズルソルバー</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!--========================
            左側
    =========================-->

    <section class="leftPanel">

        <h2>伝承盤面</h2>

        <p class="description">
            マスをクリックして「使用不可マス」を設定
        </p>

        <div id="board" class="board"></div>

        <div class="boardButtons">

            <button id="clearBoard">
                盤面クリア
            </button>

            <button id="searchBtn">
                探索開始
            </button>

        </div>

    </section>

    <!--========================
            右側
    =========================-->

    <section class="rightPanel">

        <h2>条件設定</h2>

        <div class="conditionBox">

    <!-- Aランク -->
    <div class="conditionRow">

        <label>Aランク（L型）以上</label>

        <div class="counter">

            <button id="minusA" class="counterBtn">－</button>

            <span id="needA" class="counterValue">0</span>

            <button id="plusA" class="counterBtn">＋</button>

        </div>

    </div>

    <!-- Bランク -->
    <div class="conditionRow">

        <label>Bランク（Z型）以上</label>

        <div class="counter">

            <button id="minusB" class="counterBtn">－</button>

            <span id="needB" class="counterValue">0</span>

            <button id="plusB" class="counterBtn">＋</button>

        </div>

    </div>

    <!-- Cランク -->
    <div class="conditionRow">

        <label>Cランク（T型）以上</label>

        <div class="counter">

            <button id="minusC" class="counterBtn">－</button>

            <span id="needC" class="counterValue">0</span>

            <button id="plusC" class="counterBtn">＋</button>

        </div>

    </div>

</div>
        <hr>

        <h2>探索結果</h2>

        <div id="resultCount">

            0件

        </div>

        <div class="sortBox">

            <label>並び順</label>

            <select id="sortType">

                <option value="default">
                    発見順
                </option>

                <option value="A">
                    Aランクが多い順
                </option>

                <option value="B">
                    Bランクが多い順
                </option>

                <option value="C">
                    Cランクが多い順
                </option>

            </select>

        </div>

    </section>

</div>

<!--========================
        結果一覧
=========================-->

<div id="resultArea" class="resultArea">

</div>

<!--========================
        ページ送り
=========================-->

<div id="pagination" class="pagination">

</div>

<script src="shapes.js"></script>
<script src="solver.js"></script>
<script src="app.js"></script>

</body>
</html>
